<!doctype html>
<html lang="en" data-theme="mud">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule · Dingleberry League</title>
<meta name="description" content="The Dingleberry League: a 10-team dynasty fantasy football league on Sleeper.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#1a0f07">
<script src="js/theme.js"></script>
</head>
<body>
<main>
<h1 class="page-title">LEAGUE <span class="hl">SCHEDULE</span></h1>
<p class="page-sub">Every matchup, every week, every season since 2022, with the playoffs and the Toilet Bowl. Live from Sleeper.</p>
<div class="sch-controls">
  <label class="pick"><span class="muted small">Season</span> <select class="select" id="sch-season"><option>Loading…</option></select></label>
  <label class="pick"><span class="muted small">Week</span> <select class="select" id="sch-week"></select></label>
  <div class="sch-step"><button class="sch-btn" id="sch-prev" aria-label="Previous week">‹ Prev</button><button class="sch-btn" id="sch-next" aria-label="Next week">Next ›</button></div>
</div>
<h2 class="section-title" id="sch-week-title">This Week</h2>
<div id="sch-cards" class="sch-cards"><div class="loading">Loading matchups…</div></div>
<h2 class="section-title" id="sch-season-title">📋 Full Season</h2>
<div id="sch-grid" class="sch-grid"></div>
<p class="note" id="sch-note"></p>
</main>
<script src="js/common.js"></script>
<script src="js/schedule-data.js"></script>
<script src="js/schedule.js"></script>
</body>
</html>
