<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team History moved to Team Info · Dingleberry League</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="team-info.html">
<script>
  /* Team History merged into Team Info: keep ?team=N (and turn old #team-N anchors into ?team=N) */
  (function () {
    var q = location.search, m = location.hash.match(/^#team-(\d+)$/);
    if (!q && m) q = "?team=" + m[1];
    location.replace("team-info.html" + q + (m ? "" : location.hash));
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=team-info.html"></noscript>
</head>
<body>
<p>Team History now lives on <a href="team-info.html">Team Info</a>.</p>
</body>
</html>
