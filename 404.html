<meta name="robots" content="noindex">
<script>
  /* GitHub Pages serves this file for missing URLs at any depth. On a project
     site (user.github.io/<repo>/...) point relative links at the repo root. */
  (function () {
    if (/\.github\.io$/.test(location.hostname)) {
      var seg = location.pathname.split("/")[1];
      var b = document.createElement("base");
      b.href = location.origin + "/" + (seg && seg.indexOf(".") < 0 ? seg + "/" : "");
      document.head.appendChild(b);
    }
  })();
</script>
